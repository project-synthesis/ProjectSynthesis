name: Integration Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-integration:
    name: backend-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Match CI (see .github/workflows/ci.yml) — pin to 3.12 for
          # hnswlib wheel stability on GH runners.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Evict any cached native-built hnswlib wheel: the pip cache restores
      # via prefix restore-keys, so a requirements.txt hash bust alone does
      # not stop pip from reusing the poisoned wheel without re-running
      # setup.py (where HNSWLIB_NO_NATIVE takes effect).
      - run: pip cache remove hnswlib || true
      # HNSWLIB_NO_NATIVE: hnswlib ships sdist-only; without this flag its
      # setup.py compiles with -march=native, and the pip cache then serves
      # a CPU-specific wheel to runners lacking those instructions (SIGILL,
      # exit 132 — observed 2026-06-12 in embedding_index HNSW-backend tests).
      - run: pip install -r requirements.txt
        env:
          HNSWLIB_NO_NATIVE: "1"
      - run: pytest tests/test_integration.py -q --tb=short
